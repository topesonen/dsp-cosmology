[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dsp-cosmolgy"
description = "DSP 2026 project about the Prior for the unknown properties of the Local Group from large cosmological simulations."
readme = "README.md"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = [
    "illustris_python @ git+https://github.com/illustristng/illustris_python.git",
    "matplotlib >= 3.10.0",
    "seaborn >= 0.13.0",
    "scipy >= 1.15.0",
    "pandas >= 3.0.0",
    "numpy >= 2.2.0",
    "scikit-learn >= 1.6.0",
    "h5py >= 3.11.0",
    "tabulate >= 0.10",
    "optuna"
]

[tool.setuptools]
packages = []