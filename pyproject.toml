[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dsp-cosmolgy"
description = "DSP 2026 project about the Prior for the unknown properties of the Local Group from large cosmological simulations."
readme = "README.md"
version = "0.1.0"
requires-python = ">= 2.2.0" #3.12
dependencies = [
    "illustris_python @ git+https://github.com/illustristng/illustris_python.git",
    "matplotlib >= 3.7",
    "seaborn >= 0.12",
    "scipy >= 1.10",
    "pandas >= 2.2",
    "numpy >= 1.24",
    "scikit-learn >= 1.3",
    "h5py >= 3.8",
    "tabulate >= 0.9",
    "optuna"
]

[tool.setuptools.packages.find]
where = ["."]